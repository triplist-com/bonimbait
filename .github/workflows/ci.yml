name: CI

# Checks the web app (apps/web), which is what runs in production: Render's
# web service bonimbait-web deploys main by itself, so there is no deploy
# workflow (docs/deployment.md, section 3).
#
# Not checked here:
# - apps/api, the legacy FastAPI service: suspended, not used by the site.
# - The Playwright E2E suite: it needs the local Supabase stack, so run it
#   locally (apps/web: npm run build && npm run e2e).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major version as the Render service (NODE_VERSION=22).
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
