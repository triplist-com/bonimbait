# Render Blueprint — Bonimbait API (legacy)
# https://render.com/docs/blueprint-spec
#
# The Blueprint "BonimBaitBluePrint" syncs this file from main automatically.
# It manages only the FastAPI backend below, which is legacy and suspended:
# search and AI answers run inside the Next.js app.
#
# The Next.js app also runs on Render (since 2026-11-08), in the Render project
# "Bonimbait": web service `bonimbait-web` and cron job `bonimbait-youtube-watch`.
# They were created through the Render API, not this Blueprint, so do NOT add
# them here: the auto-sync would create a second copy of each. Their settings
# are in docs/deployment.md (section 3). The database stays on Supabase.

services:
  # ─── FastAPI Backend (Docker) ───────────────────────────────────────
  - type: web
    name: bonimbait-api
    runtime: docker
    region: frankfurt
    plan: starter
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false  # set manually — Supabase connection string
      - key: ANTHROPIC_API_KEY
        sync: false  # set manually in Render dashboard
      - key: OPENAI_API_KEY
        sync: false  # set manually in Render dashboard
      - key: CORS_ORIGINS
        value: https://bonimbait.com,https://www.bonimbait.com,http://localhost:3000
      - key: ENV
        value: production
    healthCheckPath: /health
